# supply-chain.yml — Tedarik Zinciri Bütünlüğü CI Kapısı (F3 · T3.4)
# Rol: bağımlılık bütünlüğü (SHA-256 manifest) + bilinen CVE taraması (OSV.dev).
# Zorlar: lockfile manifest doğrulanır · high+ CVE = kırmızı build.
# Üretir: sbom manifest (denetim izi, R11-11).

name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # haftalık: pazartesi 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  supply-chain:
    name: SHA-256 manifest + OSV CVE taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit

      # 1) SHA-256 manifest — node_modules bağımlılık bütünlüğü
      #    npm ci zaten lockfile'ı doğrular; ek katman: package-lock.json hash'i
      - name: Lockfile SHA-256 (bütünlük manifesti)
        run: |
          HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          echo "package-lock.json sha256: $HASH"
          echo "$HASH" > /tmp/supply-chain-hash.txt
          # Manifestin repo'da kayıtlı haliyle karşılaştır (varsa)
          if [ -f .archcore/supply-chain-manifest.txt ]; then
            EXPECTED=$(cat .archcore/supply-chain-manifest.txt)
            if [ "$HASH" != "$EXPECTED" ]; then
              echo "::error:: package-lock.json değişmiş — manifest güncelle: .archcore/supply-chain-manifest.txt"
              echo "  mevcut : $HASH"
              echo "  beklenen: $EXPECTED"
              exit 1
            fi
            echo "✓ lockfile bütünlüğü doğrulandı"
          else
            echo "::warning:: .archcore/supply-chain-manifest.txt yok — ilk kayıt: $HASH"
          fi

      # 2) OSV.dev CVE taraması (npm audit yerine OSV — güncel feed)
      - name: OSV.dev CVE taraması
        run: |
          # npm audit high+ (npm'ın OSV beslemeli güvenlik verisi)
          npm audit --audit-level=high --omit=dev 2>&1 | tail -8 || true
          # OSV.dev API sorgusu (üretim bağımlılıkları — package-lock'dan)
          python3 - <<'PY'
          import json, urllib.request

          # package-lock.json'daki tüm node_modules paketlerini sorgula.
          lock = json.load(open("package-lock.json"))
          queries = []
          for path, info in lock.get("packages", {}).items():
              if not path.startswith("node_modules/"):
                  continue
              name = path.removeprefix("node_modules/")
              version = info.get("version", "")
              if name and version:
                  queries.append({"package": {"name": name, "ecosystem": "npm"}, "version": version})

          if not queries:
              raise SystemExit("package-lock.json bağımlılık içermiyor")

          payload = {"queries": queries}

          req = urllib.request.Request(
              "https://api.osv.dev/v1/querybatch",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
              vulns = data.get("results", [])
              critical_high = 0
              for v in vulns:
                  for item in v.get("vulns", []):
                      severity = str(item.get("database_specific", {}).get("severity", "")).upper()
                      scores = [
                          float(s.get("score", "0"))
                          for s in item.get("severity", [])
                          if s.get("type") == "CVSS_V3"
                      ]
                      if severity in {"HIGH", "CRITICAL"} or any(score >= 7.0 for score in scores):
                          critical_high += 1
              print(f"OSV taraması: {len(queries)} paket sorgulandı, {critical_high} high+ CVE")
              if critical_high > 0:
                  raise SystemExit(1)
              print("✓ OSV: high+ CVE yok")
          except Exception as e:
              print(f"::error:: OSV sorgusu başarısız — {type(e).__name__}")
              raise SystemExit(1)
          PY

      # 3) Artifact: bütünlük manifesti (denetim izi)
      - name: Upload supply-chain manifest
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-hash
          path: /tmp/supply-chain-hash.txt
          if-no-files-found: warn
